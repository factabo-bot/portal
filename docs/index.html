<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポータル</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1a18">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google.com https://*.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v1.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-v1-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <div id="date" class="date"></div>
    <div id="status" class="status"></div>
  </div>
  <div class="top-actions">
    <button id="install" class="btn" hidden title="このページをアプリとして入れます（ホーム画面・スタートメニューに出ます）">アプリにする</button>
    <button id="reload" class="btn ghost" title="読み直す">更新</button>
    <button id="edit" class="btn ghost">編集</button>
  </div>
</header>

<main class="layout">
  <section class="col col-a">
    <div class="card" id="ev-card">
      <h2>予定</h2>
      <div id="events"><div class="muted">読み込み中…</div></div>
    </div>
    <div class="card" id="weather-card">
      <h2>天気 <span class="sub">千葉市緑区</span></h2>
      <div id="weather" class="weather"><div class="muted">読み込み中…</div></div>
    </div>
    <div class="card" id="pest-card">
      <h2>病害虫予察の新着</h2>
      <div id="pest"><div class="muted">読み込み中…</div></div>
    </div>
    <div class="card" id="keihi-card" hidden>
      <h2>経費の振り分け <span class="sub" id="keihi-count"></span><button type="button" class="btn small ghost h2r" id="keihi-load">読み込む</button></h2>
      <div id="keihi"><div class="muted">「読み込む」で未仕分けの買い物メールを出します</div></div>
    </div>
    <div class="card" id="hold-card" hidden>
      <h2>保有資産 <span class="sub" id="hold-at"></span><button type="button" class="btn small ghost h2r" id="hold-paste">貼り付けて更新</button></h2>
      <div id="hold-import" hidden>
        <textarea id="hold-text" rows="5" placeholder="マネーフォワードの保有一覧（株式(現物)・投資信託の表）をそのまま貼る"></textarea>
        <div class="row-end"><button type="button" class="btn small ghost" id="hold-cancel">やめる</button><button type="button" class="btn small" id="hold-go">取り込む</button></div>
      </div>
      <div id="hold"><div class="muted">読み込み中…</div></div>
    </div>
  </section>

  <section class="col col-b">
    <div class="links" id="links"></div>
    <div class="card" id="ses-card">
      <h2>Claudeのセッション <span class="sub">押すと開きます</span><a class="btn small ghost h2r" href="https://claude.ai/code" target="_blank" rel="noopener noreferrer">新しく話す</a></h2>
      <div id="sessions"><div class="muted">読み込み中…</div></div>
    </div>
    <div class="card" id="wish-card">
      <h2>やりたいこと <span class="sub" id="wish-count"></span></h2>
      <form id="wish-form" class="wish-form">
        <input id="wish-input" maxlength="200" placeholder="〇〇したい！" autocomplete="off">
        <button class="btn">追加</button>
      </form>
      <div class="wtabs" role="tablist">
        <button type="button" data-wt="open" class="on">やりたい</button>
        <button type="button" data-wt="done">やった</button>
        <button type="button" data-wt="drop">やめた</button>
      </div>
      <div id="wishes"><div class="muted">読み込み中…</div></div>
    </div>
  </section>
</main>

<dialog id="setup">
  <form method="dialog" id="setup-form">
    <h2>窓口の設定</h2>
    <p class="muted">予定・予察・リンクの同期に使います。設定用のリンクから開いた場合は入力済みです。</p>
    <label>窓口のURL<input id="setup-url" type="url" autocomplete="off"></label>
    <label>合言葉<input id="setup-key" type="text" autocomplete="off"></label>
    <label>お金の合言葉（経費の振り分け・保有資産。この端末で使うときだけ）<input id="setup-keihi" type="text" autocomplete="off"></label>
    <label class="chk"><input type="checkbox" id="qr-keihi"> QRにお金の合言葉も入れる</label>
    <div id="qr" class="qr" hidden></div>
    <div class="row-end">
      <button type="button" id="qr-btn" class="btn ghost">スマホに渡す（QR）</button>
      <button value="cancel" class="btn ghost">閉じる</button>
      <button id="setup-save" value="save" class="btn">保存</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
